<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gates n' fences</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Headland+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>


    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
        <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
    </svg>

    <header class="cabecalho">
        <button class="icone-botao" aria-label="Abrir menu"><svg class="icone"><use href="#i-menu"/></svg></button>
        <h1 class="logo">Gates n' fences</h1>
        <button class="icone-botao" aria-label="Carrinho"><svg class="icone"><use href="#i-cart"/></svg></button>
    </header>

    <div class="tira-imagens">
        <div class="imagem-item" style="flex-basis:26%"><img src="images/tira-1.jpg" alt="Cerca de madeira com portão"></div>
        <div class="imagem-item" style="flex-basis:30%"><img src="images/tira-2.jpg" alt="Cerca horizontal moderna"></div>
        <div class="imagem-item" style="flex-basis:29%"><img src="images/tira-3.jpg" alt="Cerca horizontal de madeira escura"></div>
        <div class="imagem-item" style="flex-basis:13%"><img src="images/tira-4.jpg" alt="Cerca vertical de madeira"></div>
    </div>

    <div class="busca-wrapper">
        <div class="busca">
            <input type="search" placeholder="How can we help?">
            <svg class="icone"><use href="#i-search"/></svg>
        </div>
    </div>


    <section class="populares">
        <h2 class="titulo-secao">Popular</h2>

        <div class="grade-produtos">
            <div class="produto-item"><img src="images/popular-1.jpg" alt="Portão de ferro com pilares de pedra"></div>
            <div class="produto-item"><img src="images/popular-2.jpg" alt="Portão de metal moderno"></div>
            <div class="produto-item"><img src="images/popular-3.jpg" alt="Portão de madeira com painéis"></div>
            <div class="produto-item"><img src="images/popular-4.jpg" alt="Portão dourado ornamentado"></div>
        </div>
    </section>

</body>
</html>
